version: '3.8'

services:
  postgres:
    image: postgres:18
    container_name: assembly-voting-postgres
    restart: always
    environment:
      POSTGRES_DB: assembly_voting
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d assembly_voting"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: