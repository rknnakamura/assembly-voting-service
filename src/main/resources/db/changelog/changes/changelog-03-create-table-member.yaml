databaseChangeLog:
  - changeSet:
      id: 3
      author: renato
      changes:
        - createTable:
            tableName: member
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: cpf
                  type: varchar(11)
                  constraints:
                    nullable: false
                    unique: true
